# 1. 几乎不用 Swap，内存没到 95% 都不往硬盘挤
vm.swappiness=10
# Mint 默认 60，改成 10 就会死死抱住内存

# 2. 让目录和文件索引也留在内存里，减少找文件的读盘
vm.vfs_cache_pressure=50
# 默认 100，改 50 就是让内核别急着回收缓存

# 3. 让脏数据在内存里多待一会，攒多了再一次性写盘
# 这样就不会每改一点文件就写一次硬盘
vm.dirty_background_ratio=10
vm.dirty_ratio=30
vm.dirty_writeback_centisecs=1000
vm.dirty_expire_centisecs=3000
